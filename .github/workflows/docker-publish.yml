name: Build & Push Docker Image

# This is the CD half of the pipeline. It only runs once code has actually
# landed on main (merged PR or direct push) — never on a pull request — so
# that only reviewed, CI-passed code ever gets published as an image.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username (e.g. sumeetgaurav)
#   DOCKERHUB_TOKEN     - a Docker Hub *access token*, not your password
#                         (create one at https://hub.docker.com/settings/security)
#
# Optional repo secrets (fall back to safe placeholders if unset — see
# ci.yml for why these need *some* value even when they're not "real"):
#   NEXT_PUBLIC_CURRENCY_SYMBOL
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: sumeetgaurav/gocart

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Computes the tags/labels for the image:
      #   - `latest`            always points at the most recent main build
      #   - `sha-<short-sha>`   an immutable tag pinned to the exact commit,
      #                         so you can always redeploy a specific build
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CURRENCY_SYMBOL=${{ secrets.NEXT_PUBLIC_CURRENCY_SYMBOL || '$' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
