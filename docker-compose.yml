services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gocart
      POSTGRES_PASSWORD: gocart
      POSTGRES_DB: gocart
    ports:
      - "5432:5432"
    volumes:
      - gocart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocart"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gocart:
    build:
      context: .
      args:
        NEXT_PUBLIC_CURRENCY_SYMBOL: ${NEXT_PUBLIC_CURRENCY_SYMBOL:-$$}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: gocart:local
    env_file:
      - .env
    environment:
      # Override .env's remote DB with the local postgres service above, so
      # this compose stack is a self-contained frontend+backend+database trio.
      DATABASE_URL: postgresql://gocart:gocart@postgres:5432/gocart
      DIRECT_URL: postgresql://gocart:gocart@postgres:5432/gocart
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  gocart-db-data:
