apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocart
  namespace: gocart
  labels:
    app: gocart
spec:
  # Baseline for a fresh cluster. Once hpa.yaml is applied, the HPA owns this
  # value via the scale subresource — re-running `kubectl apply` on this file
  # resets it back to 2, which is fine for this demo but is exactly why real
  # GitOps tooling (ArgoCD) is configured to ignore diffs on spec.replicas
  # for HPA-managed Deployments (see PLAN.md, Phase 5).
  replicas: 2
  selector:
    matchLabels:
      app: gocart
  template:
    metadata:
      labels:
        app: gocart
    spec:
      # Give in-flight requests time to finish before the pod is killed.
      # Equal to the K8s default (30s); set explicitly to document intent.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spreads replicas across AZs/nodes where possible (meaningful on EKS;
      # a harmless no-op on a single-zone kind cluster since the constraints
      # are "soft" (ScheduleAnyway), not a hard scheduling requirement.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gocart
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gocart
      containers:
        - name: gocart
          image: gocart:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gocart-config
            - secretRef:
                name: gocart-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
