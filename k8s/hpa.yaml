apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gocart-hpa
  namespace: gocart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gocart
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Wait 5 minutes of sustained low usage before scaling down, so a brief
    # traffic dip doesn't thrash replicas up and down.
    scaleDown:
      stabilizationWindowSeconds: 300
