# Template only — shows the shape of the Secret the app expects.
# Never fill this in and commit it. Create the real one imperatively:
#
#   kubectl create secret generic gocart-secrets -n gocart \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=DIRECT_URL="$DIRECT_URL" \
#     --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY"
#
# (scripts/deploy.sh already does this for you, reading from .env)
apiVersion: v1
kind: Secret
metadata:
  name: gocart-secrets
  namespace: gocart
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@host/db?sslmode=require"
  DIRECT_URL: "postgresql://user:pass@host/db?sslmode=require"
  CLERK_SECRET_KEY: "sk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
